name: Naver trends for reels hooks

# 매일 21:13 릴스 루틴이 다음 날 릴스를 고르기 전에, 쓸 수 있는 브런치 글마다 원문 속 이름의
# 네이버 검색량(데이터랩)과 최근 7일 뉴스를 붙여 insight-reels/trends/<다음 날>.json 으로 커밋한다(Claude 미사용).
# 예약이 밀릴 수 있어 Publish clock 도 20:07 KST 에 이 워크플로를 시작한다.
on:
  schedule:
    - cron: "7 11 * * *"  # 매일 20:07 KST
  workflow_dispatch:

concurrency:
  group: naver-reels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Search volume and news for reel sources
        run: node src/cli/naver-reels.js

      - name: Commit
        run: |
          git add insight-reels/trends
          git diff --cached --quiet && exit 0
          git config user.name "bruce-content-bot"
          git config user.email "bruce-content-bot@users.noreply.github.com"
          git commit -m "chore: reels hook trends"
          git pull --rebase -q && git push
