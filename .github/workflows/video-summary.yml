name: Video summary to Notion

on:
  schedule:
    # 매일 10:00 Asia/Seoul (GitHub cron은 UTC 기준)
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "비공개 영상 등 수동으로 등록할 YouTube 주소"
        required: false
        type: string
      series:
        description: "수동 등록할 시리즈"
        required: false
        default: wednesday-bible
        type: choice
        options:
          - wednesday-bible
          - sunday-service

concurrency:
  group: bruce-video-summary
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Install yt-dlp
        run: |
          python3 -m pip install --quiet --upgrade yt-dlp
          yt-dlp --version

      # 데이터센터 IP는 YouTube가 자주 막는다. 쿠키가 있으면 그 경로로 붙는다.
      - name: Prepare YouTube cookies
        if: env.YOUTUBE_COOKIES != ''
        run: |
          printf '%s' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/youtube-cookies.txt"
          echo "YOUTUBE_COOKIES_FILE=$RUNNER_TEMP/youtube-cookies.txt" >> "$GITHUB_ENV"

      - name: Register a manually supplied video
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.url != '' }}
        env:
          VIDEO_URL: ${{ inputs.url }}
          VIDEO_SERIES: ${{ inputs.series }}
        run: pnpm video:add -- "$VIDEO_URL" --series "$VIDEO_SERIES"

      # 설정 문제를 처리 도중이 아니라 로그 맨 앞에서 진단한다. 실행은 막지 않는다.
      - name: Check setup
        continue-on-error: true
        run: pnpm video:check

      - name: Discover new channel videos
        run: pnpm video:discover

      - name: Summarize due videos and upload to Notion
        run: pnpm video:process

      - name: Commit queue state and summaries
        run: |
          # git diff는 추적되지 않는 새 요약 파일을 보지 못한다.
          if [ -z "$(git status --porcelain -- data/video-state.json content/video)" ]; then
            exit 0
          fi
          git config user.name "bruce-content-bot"
          git config user.email "bruce-content-bot@users.noreply.github.com"
          git add -- data/video-state.json content/video
          git commit -m "chore: sync video summaries"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report failure as GitHub issue
        if: failure()
        run: |
          title="[자동화] 영상 요약 작업 실패"
          body=$(printf '실행: https://github.com/%s/actions/runs/%s\n\n자막 생성 지연, YouTube 봇 차단, Notion 토큰 또는 OpenAI 키를 확인해 주세요. 대기열은 보존되며 다음 실행에서 재시도합니다.' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          issue=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
