name: YouTube debug (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe channel videos page
        run: |
          node --input-type=module -e '
          const H={"user-agent":"Mozilla/5.0","accept-language":"ko-KR,ko;q=0.9"};
          for (const u of ["https://www.youtube.com/@bruce.insight/videos","https://www.youtube.com/@bruce.insight","https://www.youtube.com/channel/UCCRzzl43nHs5bwfJzqupylw/videos"]) {
            const r=await fetch(u,{headers:H}); const t=await r.text();
            const count=(s)=>t.split(s).length-1;
            console.log("==",u,r.status,"len",t.length,"title",(t.match(/<title>([^<]*)<\/title>/)||[])[1]);
            console.log({ytInitialData:count("ytInitialData"),videoRenderer:count("\"videoRenderer\""),lockupViewModel:count("lockupViewModel"),gridVideoRenderer:count("gridVideoRenderer"),contentId:count("\"contentId\""),videoId:count("\"videoId\""),consent:count("consent.youtube.com"),reel:count("reelItemRenderer"),shortsLockup:count("shortsLockupViewModel")});
            const ids=[...t.matchAll(/"contentId":"([\w-]{11})"/g)].slice(0,6).map(m=>m[1]);
            const vids=[...t.matchAll(/"videoId":"([\w-]{11})"/g)].slice(0,6).map(m=>m[1]);
            console.log("contentIds",ids,"videoIds",vids);
            const i=t.indexOf("lockupViewModel"); if(i>0) console.log("lockup snippet",t.slice(i-60,i+500).replace(/\n/g," "));
            const j=t.indexOf("\"videoRenderer\""); if(j>0) console.log("renderer snippet",t.slice(j,j+400));
          }
          const w=await fetch("https://www.youtube.com/watch?v=n_dz1Q3K3_g",{headers:H}); const wt=await w.text();
          console.log("watch",w.status,"hasPlayer",wt.includes("ytInitialPlayerResponse"),"shortDescription",wt.includes("shortDescription"),"publishDate",(wt.match(/"publishDate":"([^"]+)"/)||[])[1]);
          const s=await fetch("https://www.youtube.com/shorts/n_dz1Q3K3_g",{headers:H,method:"HEAD",redirect:"manual"}); console.log("shorts probe",s.status);
          '
