name: Insight reels publish

on:
  schedule:
    # 월·수 카드뉴스, 화·목 릴스 07:00 KST 게시 목표.
    # GitHub 예약은 몇 시간씩 밀릴 수 있다(2026-10-05: 06:50 예정 → 09:12 시작). 그래서 일찍 한 번, 늦게 한 번 건다.
    # 이미 posted 면 두 번째 실행은 아무것도 하지 않는다.
    - cron: "15 21 * * 0,1,2,3"  # 06:15 KST
    - cron: "30 23 * * 0,1,2,3"  # 08:30 KST(앞 실행이 밀리거나 실패했을 때)
  workflow_dispatch:
    inputs:
      post_date:
        description: "게시할 날짜(YYYY-MM-DD, 비우면 오늘 KST)"
        required: false
      check_only:
        description: "게시하지 않고 토큰·계정만 확인"
        type: boolean
        default: false

concurrency:
  group: insight-reels-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Wait until 07:00 KST
        if: github.event_name == 'schedule'
        run: |
          # 오늘(KST) 07:00 까지 기다린다. 이미 지났으면(예약이 밀린 경우) 바로 게시한다.
          now=$(date +%s); today_kst=$(date -u -d "@$((now + 9*3600))" +%F)
          target=$(date -d "$today_kst 07:00 +0900" +%s)
          if [ "$now" -lt "$target" ]; then echo "07:00 KST 까지 $(( (target-now)/60 ))분 대기"; sleep $((target - now)); else echo "07:00 KST 지남 — 바로 게시"; fi

      - name: Publish today's reel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID || '17841459178252032' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_MENTION: ${{ vars.IG_MENTION || 'heo.boram' }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          IG_AI_LABEL: ${{ vars.IG_AI_LABEL }}
          POST_DATE: ${{ inputs.post_date }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: python3 insight-reels/scripts/publish_ig.py

      - name: Record result
        run: |
          git diff --quiet -- insight-reels/posts && exit 0
          git config user.name "bruce-content-bot"
          git config user.email "bruce-content-bot@users.noreply.github.com"
          git add insight-reels/posts
          git commit -m "chore: mark insight reel posted"
          git pull --rebase -q && git push
