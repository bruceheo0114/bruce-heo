name: Insight reels publish

on:
  schedule:
    # 월·수 카드뉴스, 화·목 릴스 07:00 KST 게시 목표.
    # GitHub 예약은 몇 시간씩 밀릴 수 있다(2026-10-05: 06:50 예정 → 09:12 시작).
    # 그래서 04~06시에 미리 세 번 시작해 두고, 먼저 시작한 실행이 07:00 까지 기다렸다 올린다.
    # 07:00 이 지나서 시작하면 바로 올린다. 이미 posted 면 나머지 실행은 아무것도 하지 않는다.
    # (정각은 GitHub 가 가장 붐벼 더 밀리므로 7분에 건다)
    - cron: "7 19 * * *"   # 04:07 KST
    - cron: "7 20 * * *"   # 05:07 KST
    - cron: "7 21 * * *"   # 06:07 KST
  workflow_dispatch:
    inputs:
      post_date:
        description: "게시할 날짜(YYYY-MM-DD, 비우면 오늘 KST)"
        required: false
      post_at:
        description: "이 시각(KST HH:MM)까지 기다렸다 게시. 비우면 바로"
        required: false
      check_only:
        description: "게시하지 않고 토큰·계정만 확인"
        type: boolean
        default: false

concurrency:
  group: insight-reels-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330  # 04:07 시작 실행이 07:00 까지, 수동 post_at 이 몇 시간 뒤까지 기다릴 수 있게
    steps:
      - uses: actions/checkout@v4

      - name: Wait until posting time (KST)
        if: github.event_name == 'schedule' || inputs.post_at != ''
        env:
          POST_AT: ${{ github.event_name == 'schedule' && '07:00' || inputs.post_at }}
        run: |
          # 오늘(KST) POST_AT 까지 기다린다. 이미 지났으면(예약이 밀린 경우) 바로 게시한다.
          now=$(date +%s); today_kst=$(date -u -d "@$((now + 9*3600))" +%F)
          target=$(date -d "$today_kst $POST_AT +0900" +%s)
          if [ "$now" -lt "$target" ]; then echo "$POST_AT KST 까지 $(( (target-now)/60 ))분 대기"; sleep $((target - now)); else echo "$POST_AT KST 지남 — 바로 게시"; fi
          # 기다리는 동안 보류(hold)·게시(posted)로 바뀌었을 수 있어 최신 상태를 다시 받는다
          git pull -q --rebase || echo "::warning::최신 상태를 받지 못해 시작 시점 상태로 진행"

      - name: Publish today's reel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID || '17841459178252032' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_MENTION: ${{ vars.IG_MENTION || 'heo.boram' }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          IG_AI_LABEL: ${{ vars.IG_AI_LABEL }}
          POST_DATE: ${{ inputs.post_date }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: python3 insight-reels/scripts/publish_ig.py

      - name: Record result
        run: |
          git diff --quiet -- insight-reels/posts && exit 0
          git config user.name "bruce-content-bot"
          git config user.email "bruce-content-bot@users.noreply.github.com"
          git add insight-reels/posts
          git commit -m "chore: mark insight reel posted"
          git pull --rebase -q && git push
