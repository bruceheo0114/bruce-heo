name: 브런치 글 동기화 · 카드뉴스 생성

on:
  schedule:
    # 매일 오전 9시, 오후 9시 (KST) — cron 은 UTC 기준입니다.
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      force_post_id:
        description: '카드뉴스를 다시 만들 글 번호 (예: 211). 비워두면 새 글만 처리합니다.'
        required: false
        type: string
      skip_cardnews:
        description: '글 목록만 갱신하고 카드뉴스는 건너뜁니다.'
        required: false
        type: boolean
        default: false

concurrency:
  group: brunch-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: 브런치 동기화
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRUNCH_ID: ${{ vars.BRUNCH_ID || 'heoboram' }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.force_post_id }}" ]; then
            ARGS="$ARGS --force ${{ inputs.force_post_id }}"
          fi
          if [ "${{ inputs.skip_cardnews }}" = "true" ]; then
            ARGS="$ARGS --skip-cardnews"
          fi
          node scripts/sync.js $ARGS

      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/posts.json cardnews
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋을 건너뜁니다."
            exit 0
          fi
          SUMMARY=$(node -e "
            const s = require('./data/posts.json');
            const latest = s.posts[0];
            console.log(latest ? latest.title : '브런치 글');
          ")
          git commit -m "브런치 동기화: ${SUMMARY}"
          for delay in 2 4 8 16; do
            git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            echo "push 실패 — ${delay}초 후 재시도"
            sleep $delay
            git pull --rebase origin ${GITHUB_REF_NAME} || true
          done
          git push origin HEAD:${GITHUB_REF_NAME}
