name: 브런치 글 동기화

# 새 글이 올라오면 index.html 의 글 목록을 갱신합니다.
# 카드뉴스는 자동으로 만들지 않습니다. 아래 '수동 실행'에서 글 번호를 넣었을 때만 만듭니다.

on:
  schedule:
    # 매일 오전 9시, 오후 9시 (KST) — cron 은 UTC 기준입니다.
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      cardnews_post_id:
        description: '카드뉴스를 만들 글 번호 (예: 211). 비워두면 글 목록만 갱신합니다.'
        required: false
        type: string

concurrency:
  group: brunch-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 카드뉴스를 만들 때만 브라우저를 받습니다. 평소 실행은 그냥 넘어갑니다.
      - name: Chromium 설치
        if: inputs.cardnews_post_id != ''
        run: npx playwright install --with-deps chromium

      - name: 브런치 동기화
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRUNCH_ID: ${{ vars.BRUNCH_ID || 'heoboram' }}
          CARDNEWS_POST_ID: ${{ inputs.cardnews_post_id }}
        run: |
          if [ -n "$CARDNEWS_POST_ID" ]; then
            node scripts/sync.js --force "$CARDNEWS_POST_ID"
          else
            node scripts/sync.js
          fi

      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/posts.json cardnews
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋을 건너뜁니다."
            exit 0
          fi
          SUMMARY=$(node -e "
            const s = require('./data/posts.json');
            const latest = s.posts[0];
            console.log(latest ? latest.title : '브런치 글');
          ")
          git commit -m "브런치 동기화: ${SUMMARY}"
          for delay in 2 4 8 16; do
            git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            echo "push 실패 — ${delay}초 후 재시도"
            sleep $delay
            git pull --rebase origin ${GITHUB_REF_NAME} || true
          done
          git push origin HEAD:${GITHUB_REF_NAME}
