name: Naver trends for Threads hooks

# 금요일 21:00 스레드 원고 루틴이 쓰기 전에, 다음에 쓸 브런치 글마다 원문 속 이름(브랜드·캠페인)의
# 네이버 검색량을 비교해 threads/trends/<날짜>.json 으로 커밋한다(데이터랩 10회 남짓, Claude 미사용).
on:
  schedule:
    - cron: "7 11 * * 5"  # 매주 금 20:07 KST
  workflow_dispatch:

concurrency:
  group: naver-hooks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compare names in upcoming posts
        run: node src/cli/naver-hooks.js

      - name: Commit
        run: |
          git add threads/trends
          git diff --cached --quiet && exit 0
          git config user.name "bruce-content-bot"
          git config user.email "bruce-content-bot@users.noreply.github.com"
          git commit -m "chore: threads hook trends"
          git pull --rebase -q && git push
