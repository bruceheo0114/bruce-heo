name: Marketing trend collect

# 평일 08:00 KST — GPT 로 공개 기사(업계 트렌드 10 · 화제 캠페인 10)를 모아 data/trend/DATE.json 에 커밋한다.
# 메일은 08:30 Claude(Haiku) 발송 루틴이 이 파일을 읽어 보낸다. 고객사 정보는 이 저장소에 두지 않는다.
on:
  schedule:
    - cron: "0 23 * * 0-4"
  workflow_dispatch:
    inputs:
      date:
        description: "수집 기준일(YYYY-MM-DD, 비우면 오늘 KST)"
        required: false
      force:
        description: "주말·공휴일이어도 수집"
        type: boolean
        default: false

concurrency:
  group: trend-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Collect
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TREND_DATE: ${{ inputs.date }}
          TREND_FORCE: ${{ inputs.force && '1' || '' }}
        run: node src/cli/trend-collect.js

      - name: Commit
        run: |
          git add data/trend
          git diff --cached --quiet && exit 0
          git config user.name "bruce-content-bot"
          git config user.email "bruce-content-bot@users.noreply.github.com"
          git commit -m "chore: collect marketing trends"
          git pull --rebase -q && git push
