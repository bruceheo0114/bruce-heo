name: Publish due LinkedIn content

on:
  schedule:
    # Every day 18:30 Asia/Seoul (GitHub cron uses UTC)
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the next item without publishing
        required: false
        type: boolean
        default: false

concurrency:
  group: bruce-content-automation
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publish-one:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_MODEL: gpt-5.6-terra
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
      LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202605' }}
      SOCIAL_DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and validate
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test
          pnpm check

      - name: Publish at most one due LinkedIn package
        id: publish
        continue-on-error: true
        run: pnpm publish:due

      - name: Persist channel results
        if: always() && steps.publish.outcome != 'skipped'
        run: |
          git config user.name "bruce-content-bot"
          git config user.email "bruce-content-bot@users.noreply.github.com"
          git add -- data/automation-state.json
          while IFS= read -r file; do
            [ -n "$file" ] && git add -- "$file"
          done < <(git diff --name-only -- content)
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: persist social publishing state"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report publishing failure
        if: steps.publish.outcome == 'failure'
        run: |
          title="[자동화] LinkedIn 게시 실패"
          body=$(printf '실행: https://github.com/%s/actions/runs/%s\n\n게시물 ID가 생성된 경우 먼저 저장했으며 실패한 단계만 다음 슬롯에 재시도합니다. 토큰 만료와 개인 회원 게시·댓글 권한을 확인해 주세요.' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          issue=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          exit 1
