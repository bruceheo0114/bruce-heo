name: Insight reels reference

# 참고하고 싶은 인스타그램 공개 게시물 링크(공백으로 여러 개)의 이미지·캡션을 insight-reels/references/ 에 받아 둔다.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "인스타그램 게시물 링크(공백으로 구분)"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Capture references
        env:
          URLS: ${{ inputs.urls }}
        run: node insight-reels/scripts/capture_ig_reference.mjs $URLS
      - name: Commit
        run: |
          git add insight-reels/references
          git diff --cached --quiet && exit 0
          git config user.name "bruce-content-bot"
          git config user.email "bruce-content-bot@users.noreply.github.com"
          git commit -m "chore: save Instagram reference posts"
          git pull --rebase -q && git push
