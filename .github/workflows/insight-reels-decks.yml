name: Insight noon cards render

# 수·금 카드뉴스 루틴이 posts/DATE.noon.json(status=render)과 posts/DATE.noon.deck.json 을 커밋하면
# LG 카드뉴스와 같은 렌더러(src/lib/card-renderer.js)로 그려 media/DATE-noon/ 에 커밋한다. Claude 를 쓰지 않는다.
on:
  push:
    branches: [main]
    paths:
      - "insight-reels/posts/*.noon.json"
      - "insight-reels/posts/*.noon.deck.json"
  workflow_dispatch:

concurrency:
  group: insight-noon-cards
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Render pending noon cards
        run: node src/cli/render-decks.js

      - name: Commit cards
        run: |
          git add insight-reels/posts insight-reels/media
          git diff --cached --quiet && exit 0
          git config user.name "bruce-content-bot"
          git config user.email "bruce-content-bot@users.noreply.github.com"
          git commit -m "chore: render noon insight cards"
          git pull --rebase -q && git push
