name: Insight reels media backup

# 릴스 루틴이 posts/DATE.json(video_url, cover_url)을 커밋하면
# 영상·표지를 media/DATE.mp4 / .jpg 로 내려받아 커밋한다(video_backup_url 이 가리키는 파일).
# 루틴 환경에서 CDN 이 막혀도 백업이 남도록 한다. Claude 를 쓰지 않는다.
on:
  push:
    branches: [main]
    paths:
      - "insight-reels/posts/*.json"
      - ".github/workflows/insight-reels-backup.yml"
  workflow_dispatch:

concurrency:
  group: insight-reels-backup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download missing media
        run: |
          cd insight-reels
          for f in posts/????-??-??.json; do
            d=$(basename "$f" .json)
            for pair in "video_url mp4" "cover_url jpg"; do
              set -- $pair
              url=$(jq -r ".$1 // empty" "$f")
              out="media/$d.$2"
              [ -n "$url" ] || continue
              # 받은 주소를 옆에 적어 두고, 같은 날짜를 다시 만들어 주소가 바뀌면 새로 받는다(2026-10-19: 예전 편 사본이 남던 문제).
              # 주소 기록이 없는 예전 파일은 이미 게시된 편이면 그대로 두고, 아직 예약 중이면 새로 받는다.
              if [ -s "$out" ]; then
                if [ -f "$out.src" ]; then
                  [ "$(cat "$out.src")" = "$url" ] && continue
                elif [ "$(jq -r '.status' "$f")" != "scheduled" ]; then
                  printf '%s' "$url" > "$out.src"; continue
                fi
              fi
              if curl -sfL --retry 3 -o "$out.part" "$url" && [ -s "$out.part" ]; then
                mv "$out.part" "$out"; printf '%s' "$url" > "$out.src"; echo "saved $out"
              else
                rm -f "$out.part"; echo "::warning::download failed: $out ($url)"
              fi
            done
          done

      - name: Commit media
        run: |
          git add insight-reels/media
          git diff --cached --quiet && exit 0
          git config user.name "bruce-content-bot"
          git config user.email "bruce-content-bot@users.noreply.github.com"
          git commit -m "chore: back up insight reels media"
          git pull --rebase -q && git push
