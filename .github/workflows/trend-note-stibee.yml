name: Trend note Stibee

# 「브루스의 트렌드 노트」 email.html 이 main 에 올라오면 스티비 주소록(527738)에 일반 이메일로 만들고
# 발행일 08:00(KST)에 예약 발송한다. 원고가 다시 고쳐지면 예약을 풀고 본문을 바꿔 다시 예약한다.
# 키는 Secrets 의 STIBEE_API_KEY(스티비 워크스페이스 설정 → API 키, 프로 요금제 이상). 없으면 건너뛴다.
# 보류: Actions 에서 이 워크플로를 action=cancel, date=<발행일> 로 실행하거나 스티비에서 예약 취소.
#
# 지금은 꺼 둔 상태(2026-11-03): 스티비가 스탠다드 요금제라 이메일 API 를 거절한다("프로 요금제가 필요합니다").
# 매주 예약은 브루스가 직접 한다 → newsletter/stibee/WEEKLY_SEND.md
# 프로로 올리면 아래 push 트리거 주석을 풀고 루틴 지침 7단계를 예약 상태 안내로 되돌린다(SETUP.md 5절).
on:
  # push:
  #   branches: [main]
  #   paths:
  #     - "newsletter/trend/*/email.html"
  #     - "newsletter/trend/*/meta.json"
  workflow_dispatch:
    inputs:
      action:
        description: "reserve(예약·갱신) | cancel(예약 취소)"
        required: false
        default: reserve
      date:
        description: "발행일 YYYY-MM-DD (비우면 오늘 이후 전부)"
        required: false
        default: ""

concurrency:
  group: trend-note-stibee
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reserve:
    # meta.json 에 stibee 결과를 커밋하는 이 워크플로 자신의 커밋으로는 다시 돌지 않는다.
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'trend note stibee')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STIBEE_API_KEY: ${{ secrets.STIBEE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reserve on Stibee
        id: run
        continue-on-error: true
        env:
          ACTION: ${{ github.event.inputs.action || 'reserve' }}
          DATE: ${{ github.event.inputs.date }}
        run: node src/cli/stibee-trend-note.js "$ACTION" $DATE

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newsletter/trend
          if git diff --cached --quiet; then echo "변경 없음"; else
            git commit -m "chore: trend note stibee status"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep $((i*5)); done
          fi

      - name: Fail if reservation failed
        if: steps.run.outcome == 'failure'
        run: exit 1
