name: Naver trends for YouTube hooks

# 유튜브 제작 루틴(토·월·수 21:13 KST)이 제목·도입부를 쓰기 전에, 앞으로 7일 안에 올릴 글(queue.json yt_slot)마다
# 원문 속 이름의 네이버 검색량·제목 변형 검색량·최근 기사를 bruce-youtube/trends/<yt_slot>.json 으로 커밋한다(Claude 미사용).
on:
  schedule:
    - cron: "9 11 * * 1,3,6"  # 월·수·토 20:09 KST (publish_clock 도 같은 시각에 깨운다)
  workflow_dispatch:

concurrency:
  group: naver-youtube
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compare names in upcoming videos
        run: node src/cli/naver-youtube.js

      - name: Commit
        run: |
          git add bruce-youtube/trends
          git diff --cached --quiet && exit 0
          git config user.name "bruce-content-bot"
          git config user.email "bruce-content-bot@users.noreply.github.com"
          git commit -m "chore: youtube hook trends"
          git pull --rebase -q && git push
