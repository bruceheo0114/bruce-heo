<!-- OG image source. Render at exactly 1200x630 and export as en/og.png -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    background:#F7F8FA;position:relative;
  }
  .grid{position:absolute;inset:0}
  .grid i{position:absolute;background:#E5E8EB}
  .h1{left:0;right:0;height:1px;top:78px}
  .h2{left:0;right:0;height:1px;bottom:78px}
  .v1{top:0;bottom:0;width:1px;left:118px}
  .v2{top:0;bottom:0;width:1px;right:118px;border-left:1px dashed #D7DBE0;background:transparent}
  .sq{position:absolute;background:#1B64DA}
  .sq-tr{top:0;right:0;width:88px;height:88px}
  .sq-br{bottom:0;right:0;width:180px;height:120px}
  .sq-bl{left:38px;bottom:70px;width:24px;height:24px}
  .sq-mid{right:170px;top:335px;width:14px;height:14px}
  .plus{position:absolute;left:48px;top:68px;width:22px;height:22px}
  .plus::before,.plus::after{content:'';position:absolute;background:#1B64DA}
  .plus::before{left:10px;top:0;width:2px;height:22px}
  .plus::after{top:10px;left:0;height:2px;width:22px}
  .dots{position:absolute;right:56px;top:88px;width:96px;height:76px;
    background-image:radial-gradient(#B7C3D6 1.6px, transparent 1.6px);
    background-size:16px 16px}
  .arc{position:absolute;left:-90px;bottom:-40px;width:230px;height:230px;
    border:1px dashed #D7DBE0;border-radius:50%}
  .step{position:absolute;right:118px;top:230px;width:180px;height:180px}
  .step i{position:absolute;background:#DDE2E8}
  .s1{right:0;top:110px;width:120px;height:1px}
  .s2{right:118px;top:40px;width:1px;height:71px}
  .s3{right:118px;top:40px;width:70px;height:1px}
  .chip{position:absolute;width:11px;height:11px;background:#CBD3DC}
  .c1{right:114px;top:35px}
  .c2{right:-6px;top:105px}
  .c3{right:172px;top:176px}
  .wrap{position:absolute;left:136px;top:170px;right:160px}
  h1{font-size:132px;line-height:1;letter-spacing:-0.035em;color:#12203C;font-weight:800}
  h2{margin-top:26px;font-size:44px;line-height:1.2;letter-spacing:-0.02em;color:#12203C;font-weight:700}
  .rule{margin-top:34px;width:62px;height:5px;background:#1B64DA;border-radius:2px}
  p{margin-top:26px;font-size:25px;color:#3E4A5C;letter-spacing:-0.01em}
</style>
</head>
<body>
<div class="grid">
  <i class="h1"></i><i class="h2"></i><i class="v1"></i><i class="v2"></i>
</div>
<div class="sq sq-tr"></div>
<div class="sq sq-br"></div>
<div class="sq sq-bl"></div>
<div class="sq sq-mid"></div>
<div class="plus"></div>
<div class="dots"></div>
<div class="arc"></div>
<div class="step">
  <i class="s1"></i><i class="s2"></i><i class="s3"></i>
  <i class="chip c1"></i><i class="chip c2"></i><i class="chip c3"></i>
</div>
<div class="wrap">
  <h1>BRUCE HEO</h1>
  <h2>Brand Communication &amp; IMC Lead</h2>
  <div class="rule"></div>
  <p>Turning consumer context into memorable brands.</p>
</div>
</body>
</html>
